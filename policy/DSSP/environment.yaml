name: RoboTwin-DSSP
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - setuptools
  - wheel
  - numpy=1.23.5
  - scipy=1.10.1
  - pandas
  - matplotlib
  - scikit-learn
  - h5py=3.16.0
  - zarr=2.12.0
  - numcodecs=0.13.1
  - pyyaml=6.0.3
  - opencv
  - open3d=0.18.0
  - gymnasium=0.29.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1+cu121
      - torchvision==0.19.1
      - hydra-core==1.2.0
      - omegaconf==2.3.0
      - diffusers==0.18.2
      - huggingface-hub==0.19.4
      - transformers==4.37.2
      - einops==0.4.1
      - wandb==0.25.1
      - tqdm==4.67.3
      - termcolor==3.3.0
      - dill==0.3.5.1
      - imageio==2.34.2
      - imageio-ffmpeg==0.6.0
      - shapely==2.1.2
      - transforms3d==0.4.2
      - trimesh==4.4.3
      - pyquaternion==0.9.9
      - pyglet==1.5.31
      - sapien==3.0.0b1
      - mplib==0.2.1
      - toppra==0.6.3

# Setup instructions: docs/INSTALLATION.md from the repository root.
# Install PyTorch3D, causal-conv1d and Mamba after this environment is created.
# Their CUDA builds require the installed PyTorch and a matching CUDA toolchain.
# Simulator assets and CUDA extensions are installed separately; see the setup guide.
